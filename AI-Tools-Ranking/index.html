<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Rankings</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <div>
          <h1>AI Rankings</h1>
        </div>
      </div>
      <div class="info-badge">
        <span class="badge-label">Freq:</span><span class="badge-value">Bi-Monthly</span>
        <span class="badge-label badge-sep">Last:</span><span class="badge-value badge-green" id="last-updated">—</span>
        <span class="badge-label">Cost:</span><span class="badge-value" id="api-cost">—</span>
        <span class="badge-label badge-sep">Next:</span><span class="badge-value" id="countdown">—</span>
      </div>
    </div>
  </header>

  <main>
    <div class="single-col-layout">
      <div class="col-title">🏆 Top 5 AI Models</div>
      <div class="source-note">
        <span class="source-dot"></span>
        Live Arena AI (LMSYS) ELO · Code, Vision &amp; Document scored on their own Arena boards
      </div>
      <div id="rankings-grid" class="rankings-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>AI Rankings · Arena AI (LMSYS) leaderboard ELO · updated 1st &amp; 15th of each month</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
