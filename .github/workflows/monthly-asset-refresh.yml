name: Monthly Asset Projections Refresh

on:
  schedule:
    - cron: '0 8 15 * *'  # 8am UTC on the 15th — after EIA's STEO lands (~6th-12th)
  workflow_dispatch:      # Allow manual trigger from GitHub Actions tab
    inputs:
      scope:
        description: 'What to refresh'
        type: choice
        default: full
        options:
          - full          # all 17 assets; searched rows only if their publisher is due
          - repair-stale  # only assets the last run left stale
          - only          # just the ids listed below
      only_ids:
        description: "Comma-separated asset ids, e.g. oil,copper (only used when scope = 'only')"
        type: string
        default: ''
      force_search:
        description: 'Also re-run searched rows whose publisher is not due yet (costs money)'
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic yfinance

      - name: Update asset projections
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Scheduled runs have no inputs, so default to a full refresh.
          SCOPE: ${{ github.event.inputs.scope || 'full' }}
          ONLY_IDS: ${{ github.event.inputs.only_ids }}
          FORCE_SEARCH: ${{ github.event.inputs.force_search }}
          # Without this, Python block-buffers stdout and every log line lands
          # with the timestamp of the final flush, which makes the log useless
          # for telling how long anything actually took.
          PYTHONUNBUFFERED: '1'
        run: |
          FORCE=""
          if [ "$FORCE_SEARCH" = "true" ]; then FORCE="--force-search"; fi
          case "$SCOPE" in
            repair-stale)
              python Asset-Classes/update_data.py --repair-stale $FORCE
              ;;
            only)
              if [ -z "$ONLY_IDS" ]; then
                echo "::error::scope 'only' requires only_ids to be set"
                exit 1
              fi
              python Asset-Classes/update_data.py --only "$ONLY_IDS" $FORCE
              ;;
            *)
              python Asset-Classes/update_data.py $FORCE
              ;;
          esac

      - name: Commit updated data
        env:
          SCOPE: ${{ github.event.inputs.scope || 'full' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Asset-Classes/data.json Asset-Classes/history.json
          git diff --staged --quiet || git commit -m "chore: asset projection refresh ($SCOPE) $(date +%Y-%m-%d)"
          git push
