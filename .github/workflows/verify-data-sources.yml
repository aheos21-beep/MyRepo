name: Verify data sources (throwaway)

# Temporary. Confirms the three benchmarks that need full holdings files, and
# the EIA v2 query shape. Commits nothing — read the job log.
#
# Run 2 found that a wrong product ID still returns HTTP 200 and a valid CSV,
# just for the wrong fund (239500 served DVY while labelled IDV). So this run
# checks the fund NAME inside each file, not just that a file came back.
#
# Delete once the answers are recorded.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Confirm holdings files and check EIA
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python - <<'PY'
          import os, re, io, csv, requests

          UA = {"User-Agent": "Mozilla/5.0 (compatible; asset-classes-verify/1.0)"}

          def get(url):
              try:
                  return requests.get(url, headers=UA, timeout=45)
              except Exception as e:
                  print(f"      ERROR {type(e).__name__}: {str(e)[:90]}")
                  return None

          print("=" * 72)
          print("Q3b — full holdings, with fund identity checked")
          print("=" * 72)

          # expect_name: a string that MUST appear in the returned file, so a
          # wrong-but-valid fund is caught rather than silently accepted.
          FUNDS = {
              "CDZ (CAD Dividend)": (
                  "https://www.blackrock.com/ca/investors/en/products/239834/ishares-sptsx-canadian-dividend-aristocrats-index-fund",
                  "Dividend Aristocrats"),
              "DVY (US Dividend)": (
                  "https://www.ishares.com/us/products/239500/ishares-select-dividend-etf",
                  "Select Dividend"),
              "IDV (Intl Dividend)": (
                  "https://www.ishares.com/us/products/239499/ishares-international-select-dividend-etf",
                  "International Select Dividend"),
          }

          for label, (page, expect_name) in FUNDS.items():
              print(f"\n  {label}")
              r = get(page)
              if r is None:
                  continue
              print(f"    page status {r.status_code}")
              if r.status_code != 200:
                  continue

              hrefs = set(re.findall(r'href="([^"]+)"', r.text))
              cands = [h for h in hrefs
                       if re.search(r'(fileType=csv|latest-holdings\.csv)', h, re.I)]
              if not cands:
                  print("    NO CSV LINK FOUND")
                  continue

              for h in sorted(cands, key=len)[:2]:
                  full = h if h.startswith("http") else requests.compat.urljoin(page, h)
                  rr = get(full)
                  if rr is None:
                      continue
                  head = rr.text[:300]
                  rows = [x for x in csv.reader(io.StringIO(rr.text[:400000])) if len(x) >= 6]
                  # Identity check — this is what run 2 was missing.
                  identity = "MATCH" if expect_name.lower() in head.lower() else "*** WRONG FUND ***"
                  print(f"    {full[:110]}")
                  print(f"      status {rr.status_code}, ~{len(rows)} rows, identity {identity}")
                  print(f"      header: {head.splitlines()[0][:90]!r}")
                  # Show the column names so the parser can be written against them.
                  for line in rr.text.splitlines()[:12]:
                      if line.lower().startswith("ticker"):
                          print(f"      columns: {line[:150]}")
                          break

          print()
          print("=" * 72)
          print("Q1b — EIA v2 STEO query shape")
          print("=" * 72)

          key = os.environ.get("EIA_API_KEY", "").strip()
          if not key:
              print("\n  SKIPPED — EIA_API_KEY secret not set.")
              print("  Free signup: https://www.eia.gov/opendata/register.php")
          else:
              for series in ("WTIPUUS", "NGHHUUS"):
                  url = ("https://api.eia.gov/v2/steo/data/"
                         f"?api_key={key}&frequency=monthly&data[0]=value"
                         f"&facets[seriesId][]={series}"
                         "&sort[0][column]=period&sort[0][direction]=desc&length=6")
                  print(f"\n  {series}")
                  r = get(url)
                  if r is None:
                      continue
                  print(f"    status {r.status_code}")
                  if r.status_code != 200:
                      print(f"    body: {r.text[:300]}")
                      continue
                  try:
                      rows = r.json()["response"]["data"]
                      print(f"    {len(rows)} rows; newest first:")
                      for row in rows:
                          print(f"      {row.get('period')}  {row.get('value')} "
                                f"{row.get('unit','')}  {row.get('seriesDescription','')[:50]}")
                  except Exception as e:
                      print(f"    parse failed {type(e).__name__}: {str(e)[:100]}")
                      print(f"    body: {r.text[:300]}")
          PY
