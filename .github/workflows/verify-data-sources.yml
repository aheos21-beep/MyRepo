name: Verify data sources (throwaway)

# Temporary. Finds a deterministic route to the World Bank commodity forecasts.
#
# The LLM search route has now returned one of four commodities on three
# consecutive attempts, even with the document pinned — it appears to be
# picking figures out of news coverage rather than reading the table. Two
# candidate replacements, both fetched rather than searched:
#   A. a machine-readable file (.xlsx / .csv) published alongside the PDF
#   B. extracting the forecast table out of the PDF ourselves
#
# Commits nothing — read the job log. Delete once the answer is recorded.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pdfplumber

      - name: Look for a deterministic World Bank route
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import io, re, requests

          UA = {"User-Agent": "Mozilla/5.0 (compatible; asset-classes-verify/1.0)"}
          WANTED = ("copper", "nickel", "potassium chloride", "potash", "aluminum", "aluminium")

          def get(url, **kw):
              try:
                  return requests.get(url, headers=UA, timeout=60, **kw)
              except Exception as e:
                  print(f"      ERROR {type(e).__name__}: {str(e)[:90]}")
                  return None

          print("=" * 72)
          print("A. Is there a machine-readable file anywhere on the CMO pages?")
          print("=" * 72)

          PAGES = [
              "https://www.worldbank.org/en/research/commodity-markets",
              "https://thedocs.worldbank.org/en/doc/18675f1d1639c7a34d463f59263ba0a2-0050012025"
              "/world-bank-commodities-price-data-the-pink-sheet",
          ]
          found = set()
          for page in PAGES:
              print(f"\n  {page}")
              r = get(page)
              if r is None:
                  continue
              print(f"    status {r.status_code}, {len(r.text)} bytes")
              if r.status_code != 200:
                  continue
              links = set(re.findall(r'href="([^"]+)"', r.text))
              data_links = [h for h in links if re.search(r"\.(xlsx|xls|csv)(\?|$)", h, re.I)]
              if not data_links:
                  print("    no .xlsx/.xls/.csv links on this page")
              for h in sorted(set(data_links))[:8]:
                  full = h if h.startswith("http") else requests.compat.urljoin(page, h)
                  found.add(full)
                  print(f"    -> {full[:120]}")

          for url in sorted(found)[:6]:
              print(f"\n  fetching {url[:110]}")
              rr = get(url)
              if rr is None or rr.status_code != 200:
                  print(f"    status {rr.status_code if rr else 'ERR'}")
                  continue
              body = rr.content
              print(f"    status 200, {len(body)} bytes, "
                    f"{rr.headers.get('content-type','?')[:40]}")
              # Does it mention the commodities we need, and any forecast years?
              try:
                  import zipfile
                  if body[:2] == b"PK":
                      names = zipfile.ZipFile(io.BytesIO(body)).namelist()
                      print(f"    xlsx with {len(names)} parts")
                  text = body.decode("utf-8", errors="replace")[:200000].lower()
                  print(f"    mentions: {[w for w in WANTED if w in text]}")
                  print(f"    years seen: {sorted(set(re.findall(r'20(?:2[6-9]|3[0-5])', text)))[:8]}")
              except Exception as e:
                  print(f"    inspect failed: {type(e).__name__}")

          print()
          print("=" * 72)
          print("B. Can we extract the forecast table from the PDF ourselves?")
          print("=" * 72)

          PDF = ("https://thedocs.worldbank.org/en/doc/f3138644a1e8e2bb631399ae11d6c408-0050012026"
                 "/related/CMO-April-2026-Forecasts.pdf")
          print(f"\n  {PDF}")
          r = get(PDF)
          if r is None or r.status_code != 200:
              print(f"    status {r.status_code if r else 'ERR'} — PDF route unavailable")
          else:
              print(f"    status 200, {len(r.content)} bytes")
              import pdfplumber
              with pdfplumber.open(io.BytesIO(r.content)) as pdf:
                  print(f"    {len(pdf.pages)} page(s)")
                  for i, page in enumerate(pdf.pages[:4]):
                      text = page.extract_text() or ""
                      hits = [w for w in WANTED if w in text.lower()]
                      print(f"\n    page {i+1}: {len(text)} chars, mentions {hits}")
                      for line in text.splitlines():
                          low = line.lower()
                          if any(w in low for w in ("copper", "nickel", "potassium", "aluminum")):
                              print(f"      | {line[:150]}")
                      tables = page.extract_tables() or []
                      if tables:
                          print(f"      ({len(tables)} table(s) detected; "
                                f"first is {len(tables[0])}x{len(tables[0][0]) if tables[0] else 0})")
          PY
