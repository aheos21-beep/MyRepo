name: Verify data sources (throwaway)

# Temporary. Settles the remaining open questions in
# Asset-Classes/ASSET-SOURCES.md that need network access the dev sandbox
# does not have. Commits nothing — read the job log.
#
# Q3b: can we get FULL holdings (not yfinance's top-10) for the three
#      benchmarks where the top-10 is not representative — CDZ, SCHD, and
#      the Intl Dividend candidates IDV / ZDI.
# Q1b: does the EIA v2 STEO query shape work. Skipped unless the
#      EIA_API_KEY secret is set, so the run is still useful without it.
#
# Delete once the answers are recorded.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Discover holdings files and check EIA
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python - <<'PY'
          import os, re, io, csv, requests

          UA = {"User-Agent": "Mozilla/5.0 (compatible; asset-classes-verify/1.0)"}

          def get(url, **kw):
              try:
                  r = requests.get(url, headers=UA, timeout=45, **kw)
                  return r
              except Exception as e:
                  print(f"      ERROR {type(e).__name__}: {str(e)[:90]}")
                  return None

          def looks_like_holdings(text):
              """Count data rows in something that may be CSV with a preamble."""
              rows = [r for r in csv.reader(io.StringIO(text)) if len(r) >= 3]
              return len(rows)

          print("=" * 72)
          print("Q3b — full holdings for the three sleeves yfinance cannot cover")
          print("=" * 72)

          PAGES = {
              "CDZ (iShares CA)": "https://www.blackrock.com/ca/investors/en/products/239834/ishares-sptsx-canadian-dividend-aristocrats-index-fund",
              "IDV (iShares US)": "https://www.ishares.com/us/products/239500/ishares-international-select-dividend-etf",
              "SCHD (Schwab)":    "https://www.schwabassetmanagement.com/products/schd",
              "ZDI (BMO)":        "https://www.bmogam.com/ca-en/products/exchange-traded-fund/bmo-international-dividend-etf-zdi/",
          }

          for label, page in PAGES.items():
              print(f"\n  {label}")
              print(f"    page: {page}")
              r = get(page)
              if r is None:
                  continue
              print(f"    status {r.status_code}, {len(r.text)} bytes")
              if r.status_code != 200:
                  continue

              # Find anything that smells like a downloadable holdings file.
              hrefs = set(re.findall(r'href="([^"]+)"', r.text))
              cands = [h for h in hrefs
                       if re.search(r'(fileType=csv|\.csv|holdings.*(csv|xls)|csv.*holdings)', h, re.I)]
              if not cands:
                  print("    no csv-looking link found on the page")
                  continue
              print(f"    {len(cands)} candidate link(s); trying up to 3:")
              for h in sorted(cands, key=len)[:3]:
                  full = h if h.startswith("http") else requests.compat.urljoin(page, h)
                  print(f"      -> {full[:120]}")
                  rr = get(full)
                  if rr is None:
                      continue
                  n = looks_like_holdings(rr.text[:400000])
                  ctype = rr.headers.get("content-type", "?")[:40]
                  print(f"         status {rr.status_code}, {ctype}, ~{n} parseable rows")
                  if rr.status_code == 200 and n > 20:
                      print(f"         FIRST LINES: {rr.text[:200]!r}")

          print()
          print("=" * 72)
          print("Q1b — EIA v2 STEO query shape")
          print("=" * 72)

          key = os.environ.get("EIA_API_KEY", "").strip()
          if not key:
              print("\n  SKIPPED — EIA_API_KEY secret not set.")
              print("  Free signup: https://www.eia.gov/opendata/register.php")
          else:
              for series in ("WTIPUUS", "NGHHUUS"):
                  url = ("https://api.eia.gov/v2/steo/data/"
                         f"?api_key={key}&frequency=monthly&data[0]=value"
                         f"&facets[seriesId][]={series}"
                         "&sort[0][column]=period&sort[0][direction]=desc&length=6")
                  print(f"\n  {series}")
                  r = get(url)
                  if r is None:
                      continue
                  print(f"    status {r.status_code}")
                  if r.status_code != 200:
                      print(f"    body: {r.text[:300]}")
                      continue
                  try:
                      rows = r.json()["response"]["data"]
                      print(f"    {len(rows)} rows; newest first:")
                      for row in rows:
                          print(f"      {row.get('period')}  {row.get('value')} "
                                f"{row.get('unit','')}  {row.get('seriesDescription','')[:50]}")
                  except Exception as e:
                      print(f"    parse failed {type(e).__name__}: {str(e)[:100]}")
                      print(f"    body: {r.text[:300]}")
          PY
